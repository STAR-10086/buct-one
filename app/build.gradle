plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def versionPropsFile = file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionProps.load(new FileInputStream(versionPropsFile))
}
def code = (versionProps['VERSION_CODE'] ?: '1').toInteger()
def name = versionProps['VERSION_NAME'] ?: '0.1.0'

def readSecret = { String key ->
    def env = System.getenv(key)
    return (env != null && !env.trim().isEmpty()) ? env.trim() : null
}

def releaseKeystore = readSecret('RELEASE_SIGNING_CONFIG_FILE')?.with { file(it) }
def releaseStorePass = readSecret('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = readSecret('RELEASE_KEY_ALIAS')
def releaseKeyPass = readSecret('RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystore != null && releaseKeystore.exists() &&
        releaseStorePass != null && releaseKeyAlias != null && releaseKeyPass != null

android {
    namespace 'com.buct.one'
    // SDK 目录自 API 37 起用次版本号命名，必须写全 'android-37.0'
    compileSdkVersion 'android-37.0'

    defaultConfig {
        applicationId "com.buct.one"
        minSdk 24
        targetSdk 34
        versionCode code
        versionName name
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseKeystore
                storePassword releaseStorePass
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}']
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.01.00')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
}
