name: build-apk

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建完成后发布 Release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release 标签名（如 v0.2.0 或 v0.2.0-beta.2）'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      publish_release:
        description: '构建完成后发布 Release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: '由发版工作流传入的标签名'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ (inputs.publish_release && '0') || '1' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve Android SDK path
        id: android-sdk
        run: echo "dir=$ANDROID_HOME" >> "$GITHUB_OUTPUT"

      - name: Cache Android SDK 37
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.android-sdk.outputs.dir }}/platforms/android-37.0
            ${{ steps.android-sdk.outputs.dir }}/build-tools/37.0.0
            ${{ steps.android-sdk.outputs.dir }}/licenses
          key: android-sdk-${{ runner.os }}-37.0-37.0.0-v1

      - name: Install compileSdk 37 / build-tools 37
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ -d "$ANDROID_HOME/build-tools/37.0.0" ]; then
            echo "Android SDK 37 命中缓存，跳过安装"
            ls "$ANDROID_HOME/platforms"
            exit 0
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" \
            || "$SDKMANAGER" --install --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          ls "$ANDROID_HOME/platforms"

      - name: Setup Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}

      # 有 ANDROID_KEYSTORE_BASE64 等 secrets 则用正式签名；缺失则退回临时签名（只够自测）
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "RELEASE_SIGNING_CONFIG_FILE=$RUNNER_TEMP/release.jks"
              echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "签名：正式（secrets 已配置）"
          else
            if [ "${PUBLISH_RELEASE:-false}" = "true" ] && [[ "${RELEASE_TAG:-}" != *-* ]]; then
              echo "::error::正式版发布必须配置正式签名 secrets，拒绝使用临时签名发布"
              exit 1
            fi
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-release.jks" -alias ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=buct-one CI" > /dev/null 2>&1
            {
              echo "RELEASE_SIGNING_CONFIG_FILE=$RUNNER_TEMP/ci-release.jks"
              echo "RELEASE_STORE_PASSWORD=android"
              echo "RELEASE_KEY_ALIAS=ci"
              echo "RELEASE_KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
            echo "::warning::未配置正式签名 secrets，使用临时签名（产物只能自测，不能给用户升级）"
          fi

      - name: Package dependency rules
        run: |
          set -uo pipefail
          SRC=app/src/main/java/com/buct/one/data
          if [ ! -d "$SRC" ]; then echo "data/ 尚未创建，跳过"; exit 0; fi
          v=0
          check() {
            hits=$(grep -rl "$2" "$SRC/$1" 2>/dev/null || true)
            if [ -n "$hits" ]; then echo "::error::$1 违规依赖 $2: $hits"; v=1; fi
          }
          check store  "import com.buct.one.data.source"
          check store  "import com.buct.one.data.sync"
          check ui     "import com.buct.one.data.source"
          check sync   "import com.buct.one.ui"
          check source "import com.buct.one.data.store"
          if [ "$v" = 0 ]; then echo "包依赖检查通过"; else exit 1; fi

      - name: Build APK(s)
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          chmod +x ./gradlew
          if [ "${PUBLISH_RELEASE:-false}" = "true" ]; then
            ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace --build-cache
          else
            ./gradlew assembleRelease --no-daemon --stacktrace --build-cache
          fi

      - name: Verify APK signatures
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          APKS=(
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-universal-release.apk
          )
          if [ "${PUBLISH_RELEASE:-false}" = "true" ]; then
            APKS+=(app/build/outputs/apk/debug/app-universal-debug.apk)
          fi
          for APK in "${APKS[@]}"; do
            echo "=== Verifying $APK ==="
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"
          done

      - name: APK size gate (100MB)
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          APKS=(
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-universal-release.apk
          )
          if [ "${PUBLISH_RELEASE:-false}" = "true" ]; then
            APKS+=(app/build/outputs/apk/debug/app-universal-debug.apk)
          fi
          for APK in "${APKS[@]}"; do
            BYTES=$(stat -c%s "$APK")
            MB=$(awk "BEGIN{printf \"%.2f\", $BYTES/1048576}")
            echo "APK: $APK  size: ${BYTES} bytes (${MB} MB)"
            if [ "$BYTES" -gt $((100*1024*1024)) ]; then
              echo "::error::APK $APK (${MB}MB) 超过 100MB 门禁"
              unzip -l -v "$APK" | sort -k1 -n -r | head -30
              exit 1
            fi
            if [ "$BYTES" -gt $((80*1024*1024)) ]; then
              echo "::warning::APK $APK (${MB}MB) 已超 80MB 预警线，检查新增依赖与资源"
            fi
            echo "体积门禁通过: $(basename "$APK") (${MB}MB <= 100MB)"
          done

      - name: Per-entry size report
        if: always()
        run: |
          APK="app/build/outputs/apk/release/app-universal-release.apk"
          [ -f "$APK" ] || APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then exit 0; fi
          {
            echo "### APK 体积报告"
            echo '```'
            unzip -l "$APK" | sort -k1 -n -r | head -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Size delta vs main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          gh run download --repo "$GITHUB_REPOSITORY" --branch main --name apks --dir /tmp/baseline \
            || { echo "无基准产物，跳过 delta"; exit 0; }
          BASE=$(find /tmp/baseline -name "*universal*release*.apk" | head -1)
          [ -n "$BASE" ] || BASE=$(find /tmp/baseline -name "*.apk" | head -1)
          APK="app/build/outputs/apk/release/app-universal-release.apk"
          [ -f "$APK" ] || APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          B=$(stat -c%s "$BASE"); N=$(stat -c%s "$APK")
          {
            echo "### 体积 delta"
            echo "- main 基准: $(awk "BEGIN{printf \"%.2f\", $B/1048576}") MB"
            echo "- 本 PR:    $(awk "BEGIN{printf \"%.2f\", $N/1048576}") MB"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $(( N - B )) -gt 512000 ]; then
            echo "::warning::本 PR 增重 >500KB，请在 PR 描述写归因（新增依赖 / 资源各占多少）"
          fi

      - name: Stage CI artifacts
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          rm -rf ci-apks
          mkdir -p ci-apks
          cp \
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-universal-release.apk \
            ci-apks/
          if [ "${PUBLISH_RELEASE:-false}" = "true" ]; then
            cp app/build/outputs/apk/debug/app-universal-debug.apk ci-apks/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: ci-apks/*.apk
          if-no-files-found: error

      - name: Prepare release APK files
        if: inputs.publish_release == true && inputs.release_tag != ''
        run: |
          set -euo pipefail
          rm -rf release-dist
          mkdir -p release-dist
          TAG="${{ inputs.release_tag }}"
          VER_NAME=$(sed -n 's/^VERSION_NAME=//p' app/version.properties | tr -d '\r' | head -1)
          if [[ "$TAG" != *-* ]] && [ "v${VER_NAME}" != "$TAG" ]; then
            echo "::error::正式发版 tag ($TAG) 与 app/version.properties VERSION_NAME (${VER_NAME}) 不一致，请先更新 version.properties"
            exit 1
          fi
          cp "app/build/outputs/apk/release/app-armeabi-v7a-release.apk" "release-dist/buct-one-${TAG}-armeabi-v7a.apk"
          cp "app/build/outputs/apk/release/app-arm64-v8a-release.apk"   "release-dist/buct-one-${TAG}-arm64-v8a.apk"
          cp "app/build/outputs/apk/release/app-universal-release.apk"   "release-dist/buct-one-${TAG}-universal.apk"
          cp "app/build/outputs/apk/debug/app-universal-debug.apk"       "release-dist/buct-one-${TAG}-debug.apk"
          for ARCH in arm64-v8a armeabi-v7a universal; do
            FILE="release-dist/buct-one-${TAG}-${ARCH}.apk"
            sha256sum "$FILE" | awk '{print $1}' > "${FILE}.sha256"
          done
          ls -lh release-dist/

      - name: Generate release notes
        if: inputs.publish_release == true && inputs.release_tag != ''
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          OUT="release-dist/release-notes.md"
          VER_NAME=$(sed -n 's/^VERSION_NAME=//p' app/version.properties | tr -d '\r' | head -1)
          VER_CODE=$(sed -n 's/^VERSION_CODE=//p' app/version.properties | tr -d '\r' | head -1)

          CERT_INFO=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "release-dist/buct-one-${TAG}-universal.apk" || true)
          CERT_DN=$(printf '%s\n' "$CERT_INFO" | sed -n 's/.*certificate DN: //p' | head -1)
          CERT_SHA=$(printf '%s\n' "$CERT_INFO" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)

          if [[ "$TAG" == *-* ]]; then
            KIND_LABEL="测试版"
            SIGN_TIP="当前为预发行测试版；若与已安装版本的签名证书不同，请先卸载旧包再安装。\`debug\` 包仅用于调试抓日志，不可与正式版互相覆盖安装。"
          else
            KIND_LABEL="正式版"
            SIGN_TIP="本版本使用正式发布签名证书构建，同证书后续正式版可直接覆盖升级；若此前安装了临时签名的测试包或 \`debug\` 包，请先卸载旧包再安装。"
          fi

          {
            echo "## BUCT One ${TAG} ${KIND_LABEL}"
            echo ""
            echo "> ⚠️ **安装与签名提示**：${SIGN_TIP}"
            echo ""
            echo "### 安装包下载建议"
            echo ""
            echo "| 安装包 | 适用设备 / 用途 | 文件大小 | SHA-256 |"
            echo "| --- | --- | --- | --- |"
            for ARCH in arm64-v8a armeabi-v7a universal debug; do
              FILE="release-dist/buct-one-${TAG}-${ARCH}.apk"
              BYTES=$(stat -c%s "$FILE")
              MB=$(awk "BEGIN{printf \"%.2f\", $BYTES/1048576}")
              SHA=$(sha256sum "$FILE" | awk '{print $1}')
              case "$ARCH" in
                arm64-v8a)   DESC="**推荐**：绝大多数近几年的 64 位 Android 手机" ;;
                armeabi-v7a) DESC="较老的 32 位 ARM Android 设备" ;;
                universal)   DESC="全架构通用包（不确定设备架构或模拟器使用）" ;;
                debug)       DESC="仅开发调试 / 抓日志使用（Debug 签名）" ;;
              esac
              echo "| \`buct-one-${TAG}-${ARCH}.apk\` | ${DESC} | ${MB} MB (\`${BYTES}\` B) | \`${SHA}\` |"
            done
            echo ""
            echo "### 更新日志"
            echo ""
            if [ -f "release-notes/${TAG}.md" ]; then
              cat "release-notes/${TAG}.md"
            else
              PREV_TAG=$(git tag -l 'v*' --sort=-creatordate | grep -Fxv "$TAG" | head -1 || true)
              if [ -n "$PREV_TAG" ]; then
                echo "自 \`${PREV_TAG}\` 以来的提交记录："
                echo ""
                git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s (\`%h\`)" || true
              else
                git log -n 20 --no-merges --pretty=format:"- %s (\`%h\`)" || true
              fi
            fi
            echo ""
            echo ""
            echo "### 产物与签名校验信息"
            echo ""
            echo "- **包名**：\`com.buct.one\`"
            echo "- **版本号**：\`${VER_NAME}\`（\`versionCode = ${VER_CODE}\`）"
            echo "- **正式签名证书主体**：\`${CERT_DN}\`"
            echo "- **正式签名证书 SHA-256 指纹**：\`${CERT_SHA}\`"
          } > "$OUT"

      - name: Generate R2 manifests (update.json & latest.json)
        if: inputs.publish_release == true && inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf r2-dist
          mkdir -p r2-dist
          python3 - <<'PY'
          import datetime, hashlib, json, os, re

          tag = os.environ["RELEASE_TAG"].strip()
          repo = os.environ.get("REPO_FULL_NAME", "STAR-10086/buct-one")
          version = tag[1:] if tag.startswith("v") else tag
          channel = "beta" if "-" in tag else "stable"

          props = {}
          with open("app/version.properties", encoding="utf-8") as f:
              for line in f:
                  if "=" in line:
                      k, v = line.strip().split("=", 1)
                      props[k.strip()] = v.strip()
          version_code = int(props.get("VERSION_CODE", "1"))
          version_name = props.get("VERSION_NAME", version)

          gradle_txt = open("app/build.gradle", encoding="utf-8").read()
          min_m = re.search(r"\bminSdk\s+(\d+)", gradle_txt)
          tgt_m = re.search(r"\btargetSdk\s+(\d+)", gradle_txt)
          min_sdk = int(min_m.group(1)) if min_m else 24
          target_sdk = int(tgt_m.group(1)) if tgt_m else 34

          notes = ""
          if os.path.exists("release-dist/release-notes.md"):
              notes = open("release-dist/release-notes.md", encoding="utf-8").read().strip()

          dl_domain = "https://dl.buctone.cc.cd"
          update_domain = "https://update.buctone.cc.cd"
          gh_rel_url = f"https://github.com/{repo}/releases/tag/{tag}"
          now_iso = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          apks = {}
          for arch, obj_name in [
              ("arm64-v8a", f"buct-one-{tag}-arm64-v8a.apk"),
              ("armeabi-v7a", f"buct-one-{tag}-armeabi-v7a.apk"),
              ("universal", f"buct-one-{tag}.apk"),
          ]:
              local_path = f"release-dist/buct-one-{tag}-{arch}.apk"
              data = open(local_path, "rb").read()
              size_bytes = len(data)
              sha = hashlib.sha256(data).hexdigest().lower()
              assert 0 < size_bytes <= 104857600, f"Invalid size for {local_path}: {size_bytes}"
              assert re.fullmatch(r"[a-f0-9]{64}", sha), f"Invalid sha256 for {local_path}"
              key = f"apk/{tag}/{obj_name}"
              apks[arch] = {
                  "apkKey": key,
                  "downloadUrl": f"{update_domain}/{key}",
                  "dlUrl": f"{dl_domain}/{key}",
                  "githubUrl": f"https://github.com/{repo}/releases/download/{tag}/buct-one-{tag}-{arch}.apk",
                  "sizeBytes": size_bytes,
                  "sha256": sha,
              }

          uni = apks["universal"]
          latest_manifest = {
              "schemaVersion": 1,
              "channel": channel,
              "version": version,
              "tag": tag,
              "apkUrl": uni["dlUrl"],
              "apkKey": uni["apkKey"],
              "sizeBytes": uni["sizeBytes"],
              "sha256": uni["sha256"],
              "publishedAt": now_iso,
              "changelogMd": notes,
              "minSdk": min_sdk,
              "targetSdk": target_sdk,
              "abi": "universal",
              "githubReleaseUrl": gh_rel_url,
              "updatedAt": now_iso,
          }

          update_manifest = {
              "schemaVersion": 1,
              "channel": channel,
              "versionCode": version_code,
              "versionName": version_name,
              "version": version,
              "tag": tag,
              "forceUpdate": False,
              "minSdk": min_sdk,
              "targetSdk": target_sdk,
              "publishedAt": now_iso,
              "updatedAt": now_iso,
              "releaseNotes": notes,
              "changelogMd": notes,
              "downloadUrl": uni["downloadUrl"],
              "apkUrl": uni["dlUrl"],
              "sizeBytes": uni["sizeBytes"],
              "sha256": uni["sha256"],
              "githubReleaseUrl": gh_rel_url,
              "apks": apks,
              "downloadSources": [
                  {"name": "官方加速源（Cloudflare R2）", "url": uni["downloadUrl"]},
                  {"name": "GitHub Release 备用源", "url": uni["githubUrl"]},
              ],
          }

          with open("r2-dist/latest.json", "w", encoding="utf-8") as f:
              json.dump(latest_manifest, f, ensure_ascii=False, indent=2)
          with open("r2-dist/update.json", "w", encoding="utf-8") as f:
              json.dump(update_manifest, f, ensure_ascii=False, indent=2)
          print(f"Generated R2 manifests for {tag} (channel={channel}, versionCode={version_code})")
          PY

      - name: Publish to Release
        if: inputs.publish_release == true && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "BUCT One ${{ inputs.release_tag }}"
          prerelease: ${{ contains(inputs.release_tag, '-') }}
          body_path: release-dist/release-notes.md
          files: |
            release-dist/*.apk
            release-dist/*.sha256
          fail_on_unmatched_files: true

      - name: Upload release to Cloudflare R2
        if: inputs.publish_release == true && inputs.release_tag != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          BUCKET="${R2_BUCKET:-buct-one}"

          if [ -z "${R2_ENDPOINT:-}" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ]; then
            if [ "${REPO_FULL_NAME}" = "STAR-10086/buct-one" ] && [[ "${TAG}" != *-* ]]; then
              echo "::error::正式版发布缺少 R2_ENDPOINT / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY secrets"
              exit 1
            fi
            echo "::warning::未配置 Cloudflare R2 secrets，跳过 R2 上传"
            exit 0
          fi

          CLEAN_ENDPOINT="${R2_ENDPOINT%/}"
          CLEAN_ENDPOINT="${CLEAN_ENDPOINT%/${BUCKET}}"

          export AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}"
          export AWS_DEFAULT_REGION="auto"
          export AWS_EC2_METADATA_DISABLED="true"
          export AWS_REQUEST_CHECKSUM_CALCULATION="when_required"
          export AWS_RESPONSE_CHECKSUM_VALIDATION="when_required"

          IMMUTABLE_CACHE="public, max-age=31536000, immutable"
          POINTER_CACHE="public, max-age=60, stale-while-revalidate=300"

          upload_obj() {
            local src="$1"
            local key="$2"
            local ctype="$3"
            local cache="$4"
            echo "Uploading -> s3://${BUCKET}/${key}"
            aws s3 cp "$src" "s3://${BUCKET}/${key}" \
              --endpoint-url "${CLEAN_ENDPOINT}" \
              --no-progress \
              --content-type "${ctype}" \
              --cache-control "${cache}"
          }

          # 1. 先上传不可变版本化 APK 与 .sha256（确保指针切换时文件均已就绪）
          upload_obj "release-dist/buct-one-${TAG}-universal.apk"        "apk/${TAG}/buct-one-${TAG}.apk"              "application/vnd.android.package-archive" "${IMMUTABLE_CACHE}"
          upload_obj "release-dist/buct-one-${TAG}-universal.apk.sha256" "apk/${TAG}/buct-one-${TAG}.apk.sha256"       "text/plain; charset=utf-8"               "${IMMUTABLE_CACHE}"
          upload_obj "release-dist/buct-one-${TAG}-arm64-v8a.apk"        "apk/${TAG}/buct-one-${TAG}-arm64-v8a.apk"    "application/vnd.android.package-archive" "${IMMUTABLE_CACHE}"
          upload_obj "release-dist/buct-one-${TAG}-arm64-v8a.apk.sha256" "apk/${TAG}/buct-one-${TAG}-arm64-v8a.apk.sha256" "text/plain; charset=utf-8"           "${IMMUTABLE_CACHE}"
          upload_obj "release-dist/buct-one-${TAG}-armeabi-v7a.apk"        "apk/${TAG}/buct-one-${TAG}-armeabi-v7a.apk"    "application/vnd.android.package-archive" "${IMMUTABLE_CACHE}"
          upload_obj "release-dist/buct-one-${TAG}-armeabi-v7a.apk.sha256" "apk/${TAG}/buct-one-${TAG}-armeabi-v7a.apk.sha256" "text/plain; charset=utf-8"           "${IMMUTABLE_CACHE}"

          # 2. 最后更新版本清单指针
          if [[ "$TAG" == *-* ]]; then
            upload_obj "r2-dist/latest.json" "meta/beta.json"        "application/json; charset=utf-8" "${POINTER_CACHE}"
            upload_obj "r2-dist/update.json" "meta/update-beta.json" "application/json; charset=utf-8" "${POINTER_CACHE}"
          else
            upload_obj "r2-dist/latest.json" "meta/${TAG}.json"      "application/json; charset=utf-8" "${IMMUTABLE_CACHE}"
            upload_obj "r2-dist/latest.json" "meta/latest.json"      "application/json; charset=utf-8" "${POINTER_CACHE}"
            upload_obj "r2-dist/update.json" "update.json"           "application/json; charset=utf-8" "${POINTER_CACHE}"
          fi
          echo "Cloudflare R2 release upload complete for ${TAG}!"